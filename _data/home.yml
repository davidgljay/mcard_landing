qualifying_moment:
  heading: "Built By and For People Who Create Community"
  body: "<p>The Membership Card Protocol is a project of <a href='https://relationalitylab.org'>Relationality Lab</a>, an organization working to help people who create community earn a living wage. It is an open source, grassroots project designed to make open source technologies accessible to community builders without deep technical expertise.</p><p>While this is currently a small passion project, we hope it can one day be governed by a coalition of open source contributors and community stewards.</p>"

pillar_1:
  heading: "Easily create shared resources anywhere on the internet"
  bullets:
    - text: "Give community members a card. Anything your community makes can check for it."
    - text: "No accounts, no passwords, no complex API integrations, no single sign on, no central membership database."
    - text: "Free to use and open source."
    - text: "Works across the internet, not inside one platform."
    - text: "Private and secure by default."
    - text: "Anyone in the community can set up shared resources without relying on a central administrator."
      highlight: true
  examples_heading: "With membership cards, you can have..."
  examples:
    - icon: /img/icon-calendar.png
      label: "A calendar anyone can post to"
    - icon: /img/icon-checklist.png
      label: "Private docs and project management"
    - icon: /img/icon-pickaxe.png
      label: "A members-only Minecraft server"
    - icon: /img/icon-ballotbox.png
      label: "A voting system"
    - icon: /img/icon-car.png
      label: "A community ridesharing board"
    - icon: /img/icon-folder.png
      label: "A secure community filestore"
    - icon: /img/icon-hammer.png
      label: "A community skillshare directory"
    - icon: /img/icon-clothes.png
      label: "A free stuff board"
  closing_line: "....without having to do it all on one platform."

pillar_2:
  heading: "Securely build trust across communities"
  bullets:
    - "Your members can show cards to others to prove their affiliation. For example, someone from Dallas Street Medics could reach out to someone from Austin Mutual Aid and attach their card to prove that they are worthy of trust."
    - "Cards can be updated, annotated and revoked, so showing a card demonstrates that someone is a member in good standing."
    - "In most cases, revealing a card reveals nothing else about you. A card could prove that someone is, say, a licensed physician but reveal nothing else about them."
    - "Cards can be used to send secure messages and create invite-only chatrooms. For example, an employee of an LGBT center could easily create a chatroom that only employees from other LGBT centers in the region can enter."
  callout: "We believe that real change often starts in small conversations with people you can trust."

how_it_works:
  heading: "How It Works"
  intro: ""
  steps:
    - label: "Step 1"
      image: /img/step1-handoff.png
      heading: "Issue cards to members of your community"
      bullets:
        - "Verify that you own your community's domain name (or verify some other way)."
        - "Design your card and decide what to call it."
        - "Create a link that lets your members claim a card."
        - "When they click the link, they'll be able to add the card to a virtual wallet."
        - "If you like, you can create different cards for different roles in your community."
    - label: "Step 2"
      image: /img/step2-car.png
      heading: "Set up open source tools that use cards to grant entry"
      bullets:
        - "Select from a menu of open source tools that might be helpful to your community. (Most of these are still being built.)"
        - "Tell the tools to accept cards from your community."
        - "Invite members of your community to come check it out."
        - "Like to vibe code or have a community member who does? Building your own tools and integrating cards is easy."
    - label: "Step 3"
      image: /img/step3-tap.png
      heading: "Members present their cards to access resources or prove their affiliation to others"
      bullets:
        - "When a member clicks on a community resource it will bring up their card wallet. They'll drag the appropriate card from their wallet to the service to gain entry."
        - "They can also attach their cards to private messages, create chatrooms for people with specific cards, and (soon) attach cards to Bluesky messages to prove their affiliation."

supporting_messages:
  cards:
    - heading: "No one has to move to a new platform"
      bullets:
        - "If people like your current WhatsApp, Discord or Slack they can stay exactly where they are."
        - "Cards unlock new capabilities without disturbing what already works."
    - heading: "You can update or revoke cards whenever you like"
      bullets:
        - "A card reflects a member's current standing."
        - "You can update cards to reflect a member's accomplishments, letting others know that they are deserving of trust."
    - heading: "Your community's card data will remain private and secure"
      bullets:
        - "No single operator can see who holds a card or what they choose to do with it."
        - "The data belongs to your community, not to us."
  closing_text: "Want to learn more? Read the"
  closing_link_label: "list of assurances that membership cards offer"
  closing_link_url: "/assurances/"

honest_statement:
  heading: "Care about community? We'd love your help."
  photo_alt: "Relationality Lab"
  body: "The membership card protocol has been an open source labor of love for Relationality Lab and the community surrounding it. We have outlined the protocol and deployed the infrastructure to make it a reality, but it still needs to undergo rigorous third party auditing and we still need community partners with which to test it. We are holding off on building the front-end application that people will use to manage their cards until we have these community partnerships in place."
  status_label: "Status of the Membership Card Protocol"
  status_items:
    - text: "Design of core protocol"
      done: true
    - text: "Partial review by cybersecurity professionals"
      done: true
    - text: "System for storing cards without a centralized database"
      done: true
    - text: "System for associating cards with domain names, so it's easy to see which group cards come from"
      done: true
    - text: "System of \"presses\" for easily creating and updating cards"
      done: true
    - text: "Zero-knowledge backups of cards in case a device is lost"
      done: true
    - text: "Card verification plug-in that can be added to any website or application"
      done: true
    - text: "Cards can send and receive messages, so that people can share a card without also sharing an email or phone #"
      done: true
    - text: "Chat rooms that require cards for entry and kick members out if cards are revoked"
      done: true
    - text: "\"Relay\" system to keep cardholder activity obfuscated from the people who run card infrastructure"
      done: true
    - text: "SDKs for building web and mobile applications that use cards"
      done: true
    - text: "Partnerships with real-world communities"
      done: false
    - text: "Frontend application for creating, updating, and managing cards"
      done: false
    - text: "Thorough review by cybersecurity and trust and safety professionals"
      done: false
    - text: "Integration with an ecosystem of community applications"
      done: false

get_involved:
  heading: "Get involved"
  intro: "We're excited to partner with people with the following backgrounds:"
  audiences:
    - heading: "Community organizers"
      body: "People building communities where people regularly gather, connect, and support one another."
      detail: "Looking for partners who can test the protocol, give feedback, and potentially take part in its governance."
    - heading: "Cybersecurity and trust & safety professionals"
      body: "People who can review the protocol and check whether it lives up to its <a href=\"/assurances/\">assurances</a>."
      detail: ""
      tags:
        - "Open question: ML-KEM-768 encapsulation"
    - heading: "People building community applications"
      body: "Developers, technologists, anyone who can put together a working thing with AI coding tools."
      detail: "Build the places communities reach with their cards — calendars, directories, boards, games."
  form:
    heading: "Learn More & Get In Touch"
    intro: "An occasional email, and a real conversation if there's mutual interest."
    role_question: "Which of these are you?"
    role_hint: "check all that apply"
    roles:
      - "Community Organizer"
      - "Cybersecurity Expert"
      - "Trust & Safety Professional"
      - "Application Builder"
      - "Community Funder"
      - "Academic Researcher"
    interests:
      - "I would like to stay updated as the protocol progresses"
      - "I would like to explore community partnership"
      - "I am interested in getting involved"
    submit_label: "Reach out, we'll be in touch"
