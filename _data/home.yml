  headline: "<p>Let anyone from your community</p><p>Create places for your community</p><p>Anywhere on the internet</p>"
  subhead: "<b>The Membership Card Protocol</b> is a secure way for communities to share resources and build trust.<br>It lets non-technical community leaders hand out digital cards that can be used to prove membership and access resources."
  cta_primary:
    label: "Try It Out"
    badge: "Coming soon"
  cta_secondary:
    label: "Read the Assurances"
    url: "/assurances/"
  cta_tertiary:
    label: "Get Involved"
    url: "/#get-involved"
